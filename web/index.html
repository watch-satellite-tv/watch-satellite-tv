<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماهواره زنده — تماشای تلویزیون ماهواره‌ای</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-title" id="brandTitle">ماهواره زنده</span>
        <span class="brand-sub" id="brandSub">پخش زنده‌ی شبکه‌های ماهواره‌ای، بدون دیش</span>
      </div>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="fa">🇮🇷 فارسی</option>
        <option value="en">🇬🇧 English</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
    </header>

    <section class="player" id="playerBox">
      <div class="video-wrap">
        <video id="video" controls playsinline preload="none"></video>
        <div class="idle-overlay" id="idleOverlay">
          <span class="big-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></span>
          <span class="idle-text" id="idleText">برای تماشا، یه شبکه رو انتخاب کن</span>
        </div>
      </div>
      <div class="now-playing" id="nowPlaying" hidden>
        <span class="np-name" id="npName"></span>
        <span class="np-group" id="npGroup"></span>
        <button type="button" class="icon-btn" id="favBtn" aria-label="علاقه‌مندی">☆</button>
        <button type="button" class="report-btn" id="reportBtn">پخش نمی‌شه؟ گزارش بده</button>
      </div>
      <p class="status" id="status">یه شبکه رو از لیست پایین انتخاب کن 👇</p>
      <div class="fail-actions" id="failActions" hidden>
        <button type="button" class="fail-btn" id="altBtn"></button>
      </div>
    </section>

    <section class="controls">
      <input type="search" id="search" dir="auto" placeholder="جستجوی شبکه…" aria-label="جستجوی شبکه" autocomplete="off">
      <div class="chips" id="chips"></div>
    </section>

    <main>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>چیزی پیدا نشد.</p>
      <p class="note" id="noteText">فقط شبکه‌هایی نشون داده می‌شن که مستقیم توی گوشی پخش می‌شن. اگه شبکه‌ای پخش نشد، دکمه‌ی «گزارش بده» رو بزن تا بررسی بشه.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
